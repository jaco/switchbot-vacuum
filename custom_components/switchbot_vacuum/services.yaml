clean_rooms:
  name: "Clean Rooms"
  description: "Clean selected rooms. K10+ EU supports vacuum/mop, suction, passes and order; water overrides are S10 only."
  target:
    entity:
      domain: vacuum
      integration: switchbot_vacuum
  fields:
    rooms:
      name: "Rooms"
      description: "Room names or IDs from the selected vacuum (S10: ROOM_001; K10+: numeric or room1)."
      required: true
      example: '["ROOM_013", "ROOM_008"]'
      selector:
        object:
    mode:
      name: "Clean Mode"
      description: "S10: sweep, mop or sweep_mop (default). K10+: sweep or mop; omitted keeps current mode."
      selector:
        select:
          options:
            - "sweep"
            - "mop"
            - "sweep_mop"
    fan_level:
      name: "Fan Level"
      description: "1=quiet, 2=standard, 3=strong, 4=max. S10 default: 1; K10+ omitted: keep each room setting."
      selector:
        number:
          min: 1
          max: 4
          step: 1
    water_level:
      name: "Water Level"
      description: "S10 only: 1=low (default), 2=medium, 3=high. Leave omitted for K10+."
      selector:
        number:
          min: 1
          max: 3
          step: 1
    times:
      name: "Passes"
      description: "Number of cleaning passes"
      default: 1
      selector:
        number:
          min: 1
          max: 2
          step: 1
    force_order:
      name: "Force Order"
      description: "Clean rooms in the specified order"
      default: true
      selector:
        boolean:

force_refresh:
  name: "Force Refresh"
  description: "Force refresh device status and room data from the cloud map"
  target:
    entity:
      domain: vacuum
      integration: switchbot_vacuum
