clean_rooms:
  name: "Clean Rooms"
  description: "Start cleaning specific rooms with custom settings"
  target:
    entity:
      domain: vacuum
      integration: switchbot_vacuum
  fields:
    rooms:
      name: "Rooms"
      description: "List of room IDs (e.g. ROOM_001) or room names"
      required: true
      example: '["ROOM_013", "ROOM_008"]'
      selector:
        object:
    mode:
      name: "Clean Mode"
      description: "Cleaning mode"
      default: "sweep_mop"
      selector:
        select:
          options:
            - "sweep"
            - "mop"
            - "sweep_mop"
    fan_level:
      name: "Fan Level"
      description: "Suction power (1=quiet, 2=standard, 3=strong, 4=max)"
      default: 1
      selector:
        number:
          min: 1
          max: 4
          step: 1
    water_level:
      name: "Water Level"
      description: "Water output (1=low, 2=medium, 3=high)"
      default: 1
      selector:
        number:
          min: 1
          max: 3
          step: 1
    times:
      name: "Passes"
      description: "Number of cleaning passes"
      default: 1
      selector:
        number:
          min: 1
          max: 2
          step: 1
    force_order:
      name: "Force Order"
      description: "Clean rooms in the specified order"
      default: true
      selector:
        boolean:

clean_custom:
  name: "Clean Custom"
  description: "Clean multiple rooms in one session, each with its own mode (S10 custom cleaning mode)"
  target:
    entity:
      domain: vacuum
      integration: switchbot_vacuum
  fields:
    rooms:
      name: "Rooms"
      description: 'List of rooms with per-room modes: [{"room_id": "ROOM_002", "mode": {"fan_level": 4, "times": 2, "type": "sweep_mop", "water_level": 3}}, ...]'
      required: true
      example:
        - room_id: ROOM_002
          mode:
            fan_level: 4
            times: 2
            type: sweep_mop
            water_level: 3
        - room_id: ROOM_004
          mode:
            fan_level: 2
            times: 1
            type: sweep_mop
            water_level: 1
      selector:
        object:
    force_order:
      name: "Force Order"
      description: "Follow the room order of the list"
      default: true
      selector:
        boolean:

force_refresh:
  name: "Force Refresh"
  description: "Force refresh device status and room data from S3"
  target:
    entity:
      domain: vacuum
      integration: switchbot_vacuum
